<html>
<body>

<h2>Shopping Cart</h2>
<button onclick="bill()">Calculate Bill</button>
<p id="out"></p>

<script>
let cart = [100, 200, 300];

function bill() {
  let total = 0;

  for(let i = 0; i < cart.length; i++) {
    total = total + cart[i];
  }

  let discount = total * 10 / 100;
  let final = total - discount;

  out.innerHTML = "Total = " + total +
  "<br>Discount = " + discount +
  "<br>Final Bill = " + final;
}
</script>

</body>
</html>
