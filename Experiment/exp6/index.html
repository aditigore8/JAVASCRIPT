<html>
<body>

<h2>String Analysis</h2>
<input id="s" placeholder="Enter text">
<button onclick="check()">Check</button>
<p id="out"></p>

<script>
function check() {
 let str = s.value;

 let count = (str.match(/[.,!?]/g) || []).length;

 out.innerHTML = "Length = " + str.length +
 "<br>Uppercase = " + str.toUpperCase() +
 "<br>Punctuation = " + count;
}
</script>

</body>
</html>
